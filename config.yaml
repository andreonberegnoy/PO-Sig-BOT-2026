# ================= MY PO-SIG BOT — конфигурация =================

# ---- режим работы ----
mode: real              # paper | real  (paper = demo account, real = real money)
cdp_url: http://localhost:9222

# ---- авто-логин на po-signals.com (для хостинга / автовосстановления сессии) ----
# Сессия на сайте сбрасывается каждый час. Бот заполнит форму сам, если задано.
# Капчи нет, 2FA нет — автозаполнения достаточно.
auth:
  email: ""              # вписать email, которым логинишься
  password: ""           # вписать пароль
  login_url: "https://po-signals.com/en/app/auth/sign-in"

# ---- фильтр валютных пар ----
filter:
  auto_expiry_enabled: true  # авто-экспирация per-pair × hour (Stage 2)
                             # бот раз в 4ч пересчитывает оптимум 1-5 баров для каждой
                             # (sym, hour) из counterfactual exp_wins. См. strategy/expiry_optimizer.py
  min_pair_wr_actual: 0      # WR-based blacklist (0=выкл). Если >0 — пары с counterfactual WR<X%
                             # за последние 30 дней (signals.exp_wins 2-бар) не торгуются.
                             # Минимум 30 сигналов нужно для применения порога.
  trade_mode: otc            # "otc" | "regular" | "mixed" — какие пары РЕАЛЬНО торгуем.
                             # Аналитика (signals в БД) пишется по ОБОИМ типам всегда.
  min_payout: 92             # минимальная выплата для первой сделки (%) — для OTC-пар
  min_payout_regular: 80     # отдельный порог для обычных (не-OTC) пар. Обычно ниже.
  payout_floor: 85           # если текущая пара упала ниже — ищем другую
  max_losses_in_row: 3       # >3 минусов подряд на паре → бан на ban_hours
  min_wr1: 60                # минимальный % первой плюсовой сделки (без догонов).
                             # Пары с историческим wr1 < этого порога не торгуются
                             # (skip, не бан). 0 = выкл.
  min_wr1_recent: 70         # минимальный % первой сделки в КОРОТКОМ окне
                             # (последние recent_lookback_bars свечей). Пара
                             # должна быть хороша И долгосрочно, И в текущей
                             # форме. 0 = выкл.
  recent_lookback_bars: 200  # окно для recent-статистики (свечей)
  history_candles: 1060      # размер буфера должен совпадать с сайтом для верного HTF
  stats_lookback_bars: 1000  # окно статистики — последние N баров
  ban_hours: 12              # бан пары с >max_losses_in_row на N часов
  pause_minutes: 60          # короткая пауза (мин) для пар у которых
                             # ТОЛЬКО проходимость последних свечей провалена
                             # (а общая ОК). По умолчанию 60 мин.
  temp_pause_hours: 6        # «временная пауза» (этап 3+) — длительность для пар
                             # у которых ОБЕ проходимости провалены одновременно
                             # (общая wr1 < min_wr1 И wr1_recent < min_wr1_recent).
                             # Без учёта payout. Default 6ч.
                             # Глобальный day_off_hours удалён.
  tf: 60                     # таймфрейм свечей в секундах (60 = M1)
  asset_categories: []       # список категорий активов которые торгуем.
                             # [] = все. ["forex","crypto"] = только форекс+крипта.
                             # Доступные: forex, crypto, stocks, indices,
                             # commodities, other.

# ---- торговля ----
trading:
  base_amount: 1             # базовая сумма входа ($)
  expiry_seconds: 120        # экспирация сделки (120 = 2 минуты). При вкл auto_expiry — fallback.
  one_trade_at_a_time: true  # legacy флаг (не используется в parallel_pairs=true)
  parallel_pairs: false      # Stage 3: параллельные MG-циклы на нескольких парах (default off)
  max_parallel_pairs: 3      # макс. одновременно активных циклов когда parallel_pairs=true
  # Авто-пересчёт base_amount от живого баланса.
  # Формула: floor(balance / sum_factor × 10) / 10, где
  # sum_factor = (q^N − 1) / (q − 1)  — сумма геом. прогрессии МГ.
  # N = martingale.cycle_total_limit, q = martingale.coefficient.
  # Безопасность: пересчёт фактически применяется ТОЛЬКО когда
  # mg_step == 0 AND нет открытой/pending-сделки. Если триггер
  # сработал во время МГ — пересчёт отложен до конца цикла.
  # Если расчётная ставка < min_amount — пересчёт не применяется,
  # в TG идёт алерт.
  auto_base_amount:
    enabled: true            # master switch авто-пересчёта (default ON)
    min_amount: 1.0          # минимум по PO; меньше = не применять
    balance_pct: 100         # ПРОЦЕНТ депо выделяемый на ОДИН цикл (1-100).
                             # default 100 = весь баланс (старое поведение).
                             # Установи 10-14 чтобы каждый цикл использовал
                             # только часть депо — снижает риск slива на одном
                             # цикле. В parallel mode особенно важно: 3 цикла ×
                             # 14% = 42% депо в риске одновременно. Формула:
                             # base = floor(balance × pct/100 / sum_factor × 10)/10
                             # где sum_factor = (q^N − 1)/(q − 1).
    every_n_cycles: 0        # триггер: пересчёт каждые N успешных циклов
                             # (т.е. каждые N WIN-завершений; МГ-шаги не считаются).
                             # 0 = выкл.
    daily_recalc: false      # триггер: ежедневный пересчёт в час
                             # telegram.daily_report_hour (TZ оттуда же).
                             # Если идёт МГ-цикл — пересчёт отложен до WIN.
  # NOTE: «смены пары за цикл» больше не отдельный сеттинг.
  # Длина массива martingale.pair_limits = ЧИСЛО ПАР в цикле.
  # Например pair_limits=[3,3,2] = 3 пары → 2 смены.

# ---- расписание работы ----
# Бот торгует только в окне [start_hour, end_hour). Если конец окна
# наступил во время мартингейла — досидит до WIN, после чего поставит
# себя на паузу и отправит сообщение «отдыхаю». Часы в timezone (см. ниже).
schedule:
  enabled: false
  start_hour: 9
  end_hour: 22
  no_weekends: false           # пропускать сб/вс (TG-уведомление в начале weekend)
  # timezone берётся из telegram.daily_report_timezone

# ---- мартингейл ----
martingale:
  enabled: true              # ВКЛ/ВЫКЛ мартингейл. true = классический МГ
                             # с догонами после LOSS. false = "плоская" торговля
                             # без удвоений: каждая сделка base_amount, после
                             # любого LOSS сразу новый поиск сигнала
  coefficient: 2.1           # множитель ставки после минуса (если enabled)
  cycle_total_limit: 7       # ОБЩИЙ лимит шагов в цикле (раньше max_steps)
  stop_sum: 1000             # стоп-сумма потерь ($): ждём /resume в Telegram
  # NOTE: после плюса MG всегда сбрасывается на base_amount (см. _on_trade_closed).
  # Прежний переключатель reset_on_win был мёртвым (поведение всегда reset-on-win).
  # ─── гибкий MG с ротацией пар (этап 2/3) ───
  pair_limits: [3, 3, 2]     # лимиты перекрытий на каждой паре цикла по позиции:
                             # [0] на 1-й паре, [1] на 2-й, [2] на последней.
                             # ДЛИНА массива = число пар = (число смен + 1).
                             # На последней паре доступно = pair_limits[-1] + ВЕСЬ carry.
  # NOTE: consecutive_losses_switch удалён — единственный switch-триггер
  # это лимит сделок из pair_limits + payout_drop.
  carry_unused: true         # неиспользованные перекрытия предыдущих пар
                             # (limit - использовано) переносить в резерв
                             # и отдавать ПОСЛЕДНЕЙ паре цикла
  last_pair_until_stop_sum: true  # на последней паре цикла торговать до stop_sum
                                  # игнорируя payout drop / consecutive_losses
  manual_switch_counts: true # ручная смена пары через UI/TG засчитывается в
                             # лимит cycle_switches

# ---- retention аналитики ----
retention:
  signals_days: 180          # сколько дней хранить signals (default 6 месяцев,
                             # configurable до 365). Cleanup еженедельно.

# ---- защита от live-расхождения с моделью ----
# Если на паре в реальном времени серия LOSS превышает исторический
# max_loss_streak_to_win × multiplier, ставим пару на короткую паузу.
# Это страхует мартингейл когда форма пары изменилась, а статистика
# ещё не успела это отразить.
protection:
  live_streak_pause_enabled: true
  live_streak_multiplier: 1.5
  live_streak_pause_minutes: 60
  live_streak_min_abs: 4         # не срабатывать если live-streak < этого
  live_streak_min_history: 30    # минимум settled-сигналов в окне 30д для расчёта hist_max

# ---- аналитика: Wilson + per-exp WR + decay ----
# Эти параметры влияют ТОЛЬКО на новые поля в /api/analytics/* (wr_1..5,
# wr_*_wlb, best_exp_by_wlb, n_for_exp_*). Старые поля (wr_first, wr_chosen,
# pluses, minuses и т.д.) считаются как раньше — без decay, без min_sample.
analytics:
  min_sample_size: 20        # минимум сигналов на ячейку для best_exp_by_wlb.
                             # Если ни одна экспирация не набрала — best_exp_by_wlb=null
                             # (UI должен показать «нет данных» / fallback).
  decay_half_life_days: null # экспоненциальный распад веса сигнала по возрасту.
                             # null/0 = выкл (все сигналы весят 1.0).
                             # Рекомендуемое значение для FX: 14.
                             # Включается при появлении достаточной истории.

# ---- CONSENSUS 4/5 (параметры индикатора) ----
# 1:1 с meta.defaultParams из твоего JS
indicator:
  expiryBars: 2
  entryMode: nextBarOpen
  martingaleSteps: 0          # у индикатора отдельно от торгового мартингейла (для бэктеста)
  drawBehavior: continue
  minConsensus: 4
  requireAll5OnWeekend: false       # на выходных тоже хватает 4/5

  rsiPeriod: 14
  rsiSmoothing: 5
  qqeFactor: 4.238

  htfMultiplier: 5
  htfMaType: EMA
  htfMaPeriod: 20

  atrPeriod: 14
  atrAvgWindow: 100
  atrMinRatio: 0.7
  atrMaxRatio: 2.0

  bbPeriod: 20
  bbStdDev: 2.0
  bbZoneDepth: 0.3

  candleMaxAtrMult: 2.0
  candleReqAlign: true

  cooldownBars: 3

  statsLookbackBars: 1000     # окно «полной» статистики (свечей)
  recentLookbackBars: 200     # окно «свежей» статистики (свечей)

# ---- Telegram ----
# Реальные значения инжектятся через env-переменные TELEGRAM_TOKEN / TELEGRAM_CHAT_ID
# (см. main.py::_env_override). Здесь — только пустые/dev-плейсхолдеры.
telegram:
  token: ""
  chat_id: 0
  daily_report_hour: 7       # UTC+0; час в локальной TZ для отчёта
  daily_report_timezone: "Europe/Kyiv"

# ---- периодический отчёт ----
# Раз в сутки в указанный час локального времени (TZ из telegram.daily_report_timezone).
# Если в момент отправки активен мартингейл-цикл — ждёт его закрытия.
periodic_report:
  enabled: false
  hour: 9                    # час отправки (0..23) в локальной TZ

# ---- хранилище ----
# Railway Volume mount path: /data (changed from /app/data — earlier path didn't
# actually mount despite being attached). Files here survive deploys.
storage:
  db_path: /data/state.db
  state_path: /data/state.json
  log_path: bot.log
  log_level: INFO

# ---- прочее ----
misc:
  poll_interval_sec: 1       # как часто проверяем сигналы
  assets_refresh_sec: 30     # как часто рефрешим assets_list на сервере (fallback если не приходит сам)
